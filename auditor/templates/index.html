<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAuditAI — Backend Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#070b14] text-white flex items-center justify-center min-h-screen overflow-hidden m-0">

    <div class="relative flex flex-col items-center justify-center text-center p-8">
        <!-- Glowing Background Ambient Blur -->
        <div class="absolute -z-10 h-72 w-72 rounded-full bg-cyan-500/20 blur-[100px] animate-pulse"></div>

        <!-- Floating Animated Core -->
        <div class="relative mb-8 flex h-24 w-24 items-center justify-center">
            <!-- Outer spinning ring -->
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-cyan-500/40 animate-[spin_10s_linear_infinite]"></div>
            <!-- Inner pulsing core -->
            <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 shadow-[0_0_30px_rgba(34,211,238,0.5)] animate-bounce"></div>
        </div>

        <!-- Status Text -->
        <h1 class="text-2xl font-bold tracking-tight mb-2">
            Backend API <span class="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">Online</span>
        </h1>
        <p class="text-sm text-gray-400 max-w-sm">
            Neural scraping engine active. Waiting for secure payload requests from Next.js frontend.
        </p>

        <!-- Live Status Pill -->
        <div class="mt-6 flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-4 py-1.5 text-xs font-medium text-emerald-400">
            <span class="h-2 w-2 rounded-full bg-emerald-400 animate-ping"></span>
           All GOOD
        </div>
    </div>

</body>
</html>
